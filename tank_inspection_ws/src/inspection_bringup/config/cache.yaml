inspection_sync:
  ros__parameters:
    anchor_topic: /inspection/ultrasound/raw
    camera_max_age_s: 2.0
    camera_max_count: 100
    lidar_max_age_s: 2.0
    lidar_max_count: 40
    imu_max_age_s: 5.0
    imu_max_count: 1500
    odometry_max_age_s: 5.0
    odometry_max_count: 500
    ultrasound_max_age_s: 2.0
    ultrasound_max_count: 200
    eddy_current_max_age_s: 2.0
    eddy_current_max_count: 200
    robot_state_max_age_s: 5.0
    robot_state_max_count: 500
    probe_state_max_age_s: 5.0
    probe_state_max_count: 500
    camera_tolerance_ms: 50.0
    lidar_tolerance_ms: 100.0
    pose_max_gap_ms: 30.0
    imu_window_before_ms: 20.0
    imu_window_after_ms: 20.0
    late_message_margin_ms: 150.0
    fusion_process_delay_ms: 120.0
    pending_max_count: 200
    anchor_decimation: 1
    software_clock_match_enable: false
    software_clock_adaptive_enable: false
    camera_clock_offset_ms: 0.0
    livox_clock_offset_ms: 0.0
    clock_offset_alpha: 0.25
    clock_offset_max_ms: 20.0
    clock_offset_update_gate_ms: 45.0
    clock_offset_window_matches: 50
    asset_id: mock_tank
    course_id: course_00
    plate_id: plate_00
    weld_id: weld_00
    asset_coordinate_valid: true
    # Mock odometry is a Cartesian pose in the tank frame. Convert it back to
    # the cylindrical wall coordinate used by FusionIndex.
    asset_coordinate_mode: tank_xyz
    asset_radius_m: 15.0
    asset_start_angle_rad: 0.0
    asset_pose_standoff_m: 0.3
    camera_reliable_qos: true
