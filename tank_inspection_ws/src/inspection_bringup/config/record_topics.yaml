topics:
  - /camera/camera/depth/image_rect_raw
  - /camera/camera/depth/camera_info
  - /camera/camera/color/image_raw
  - /camera/camera/color/camera_info
  - /livox/lidar
  - /livox/imu_raw
  - /livox/imu
  - /robot/odometry
  - /robot/state
  - /inspection/ultrasound/raw
  # PAUT v1（:12346）：完整 61x896 原始数据 + 帧级元数据
  - /inspection/paut/raw_v2
  # PAUT v1 采集配置（transient_local 闩锁）。**必须**在此列出，否则录制器不订阅。
  # ⚠ 不要在 qos_overrides.yaml 为它加 durability: volatile —— 那会让配置静默丢失。
  - /inspection/paut/config
  # 注: 旧的 /inspection/paut/raw（v0 裁剪图像, :12345）已不再采集。
  #     它的消息类型 PautFrame 仍保留（bags/paut_real 等 5 个 bag 依赖其类型哈希）。
  - /inspection/eddy_current/raw
  - /inspection/probe_state
  - /tf
  - /tf_static
  - /diagnostics
  - /derived/inspection/fusion_index
production:
  max_bag_size: 10737418240
  max_bag_duration: 900
debug:
  max_bag_size: 209715200
  max_bag_duration: 30
